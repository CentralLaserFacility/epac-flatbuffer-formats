[package]
name = "epac-flatbuffer-formats-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "epac_flatbuffer_formats_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }
numpy = "0.29.0"
flatbuffers = "=23.5.26"
epac_flatbuffers_derive = { path = "../epac_flatbuffers_derive"}
