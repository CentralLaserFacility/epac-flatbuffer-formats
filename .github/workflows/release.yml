name: Release process

on:
  push:
    tags:
      - 'test-*'

permissions:
  contents: write

env:
  PACKAGE_NAME: epac-flatbuffer-formats

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install build
      - name: Build wheel
        run: python -m build
      - name: Rewrite Rust version
        run: |
          grep -q 'version = "0\.0\.0"' rust/Cargo.toml
          TAG=${{ github.ref_name }}
          VERSION=${TAG#test-}
          sed -i "/version = \"0\\.0\\.0\"/s/0\\.0\\.0/${VERSION}/" rust/Cargo.toml
      - name: Build Rust wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >
            -m rust/epac-flatbuffer-formats-rs/Cargo.toml
            --release
            -o dist
          manylinux: 2_17
      - name: Set up development environment
        run: python -m venv .venv
      - name: Install wheel
        run: .venv/bin/pip install dist/*.whl
      - name: Create lockfile
        run: .venv/bin/pip list --format freeze --exclude pip --exclude setuptools > dist/requirements.txt
      - name: Install development dependencies
        run: .venv/bin/pip install "$PACKAGE_NAME[dev]"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          files: dist/*
          generate_release_notes: true