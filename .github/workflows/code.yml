name: Code CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up development environment
        run: ./dev.py setup venv
      # - name: Generate a token
      #   id: generate-token
      #   uses: actions/create-github-app-token@v1
      #   with:
      #     app-id: ${{ vars.EPAC_DATA_CI_AUTH_ID }}
      #     private-key: ${{ secrets.EPAC_DATA_CI_AUTH_KEY }}
      #     repositories: <repository-containing-dependency>
      # - name: Install Private Dependencies
      #   env:
      #     GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      #   run: ./dev.py setup private
      - name: Run pre-commit hooks
        run: ./dev.py pre-commit
      - name: Run tests
        run: ./dev.py test
