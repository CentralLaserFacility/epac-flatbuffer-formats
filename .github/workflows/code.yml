name: Code CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up development environment
        run: ./dev.py setup venv
      - name: Run pre-commit hooks
        run: ./dev.py pre-commit
      - name: Install bindings
        run: ./dev.py setup rust-bindings
      - name: Run tests
        run: ./dev.py test
  test-selfhosted:
    if: false
    runs-on: [self-hosted, python3.10]
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up development environment
        run: ./dev.py setup venv
      - name: Run pre-commit hooks
        run: ./dev.py pre-commit
      - name: Install bindings
        run: ./dev.py setup rust-bindings
      - name: Run tests
        run: ./dev.py test
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Set up development environment
        run: ./dev.py setup venv
      - name: Install flatc
        run: ./dev.py setup flatc
      - name: Regenerate fbschemas code
        run: ./dev.py schema-generate
      - name: Compare generated code to committed
        run: git diff --exit-code src
  rust-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/epac-flatbuffer-formats-rs
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
